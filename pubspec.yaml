name: mvp
description: Sentinel Safety MVP
publish_to: 'none'
version: 1.0.0+1

environment:
  sdk: '>=3.7.0 <4.0.0'

dependencies:
  flutter:
    sdk: flutter

  # Firebase
  firebase_core: ^3.13.0
  firebase_auth: ^5.5.0
  cloud_firestore: ^5.6.0
  firebase_storage: ^12.4.0

  # State Management
  get: ^4.7.2

  # Location
  geolocator: ^14.0.0

  # Image
  image_picker: ^1.1.2

  # OTP Input
  pinput: ^5.0.0

  # Utils
  intl: ^0.20.2
  permission_handler: ^11.4.0
  crypto: ^3.0.3

dev_dependencies:
  flutter_test:
    sdk: flutter
  flutter_lints: ^5.0.0

flutter:
  uses-material-design: true